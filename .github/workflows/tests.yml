name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile faultline/*.py
      - run: python -m pip wheel . --wheel-dir dist
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: cd /tmp && faultline --help
