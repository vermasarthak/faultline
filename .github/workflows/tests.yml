name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: test Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile faultline/*.py
      - run: python -m pip wheel . --wheel-dir dist
      - run: python scripts/verify_wheel.py dist/*.whl
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: cd /tmp && faultline --help

  chroma-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install '.[chroma]'
      - run: >-
          python -m faultline compare
          --development-manifest examples/manifests/development.json
          --held-out-manifest examples/manifests/held-out.json
          --baseline stale
          --candidate-program examples/chroma_continuity.py
          --program-protocol continuity
          --timeout-seconds 60
          --fail-on-regression
